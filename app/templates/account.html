{% extends "base.html" %}
{% block title %}My account{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>My account</h1>
    <p>Your name and password for {{ app_name }}.</p>
  </div>
</div>

<div class="grid grid-2">
  <section class="card">
    <div class="card-head"><div><h2>Profile</h2></div></div>
    <div class="card-body">
      <dl class="kv" style="margin-bottom:18px">
        <dt>Username</dt><dd>{{ user.username }}</dd>
        <dt>Role</dt><dd>{{ ROLE_LABELS[user.role] }} <span class="small muted" style="font-weight:500">· {{ ROLE_HELP[user.role] }}</span></dd>
      </dl>
      <form method="post" action="/account/profile">
        <input type="hidden" name="csrf_token" value="{{ csrf }}">
        <label class="field"><span>Full name</span>
          <input class="input" name="full_name" value="{{ user.full_name or '' }}" maxlength="80" autocomplete="name">
          <small>Shown in the menu and next to the reports you generate.</small></label>
        <div class="form-foot">
          <button class="btn" data-busy="Saving…">{{ icon("check") }}<span>Save name</span></button>
        </div>
      </form>
    </div>
  </section>

  <section class="card">
    <div class="card-head"><div><h2>Change password</h2></div></div>
    <div class="card-body">
      <form method="post" action="/account/password">
        <input type="hidden" name="csrf_token" value="{{ csrf }}">
        <input class="sr" type="text" name="username" value="{{ user.username }}" autocomplete="username" tabindex="-1" aria-hidden="true" readonly>
        <div class="stack" style="gap:14px">
          <label class="field"><span>Current password</span>
            <input class="input" type="password" name="current" required autocomplete="current-password"></label>
          <label class="field"><span>New password</span>
            <input class="input" type="password" name="password" required minlength="{{ MIN_PASSWORD }}" maxlength="200" autocomplete="new-password">
            <small>At least {{ MIN_PASSWORD }} characters.</small></label>
          <label class="field"><span>New password again</span>
            <input class="input" type="password" name="confirm" required minlength="{{ MIN_PASSWORD }}" maxlength="200" autocomplete="new-password"></label>
        </div>
        <div class="form-foot">
          <button class="btn" data-busy="Saving…">{{ icon("lock") }}<span>Change password</span></button>
        </div>
      </form>
    </div>
  </section>
</div>

<form method="post" action="/logout">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <button class="btn btn-ghost" type="button" data-open="logout-dialog">{{ icon("logout") }}<span>Sign out</span></button>
</form>
{% endblock %}
